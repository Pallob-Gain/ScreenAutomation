[package]
name = "screen_automation"
version = "0.1.0"
edition = "2021"
description = "n8n-like node automation driven by screen regions"

[features]
default = []
# Desktop backends (screen capture, OCR, input simulation) and the graph editor UI.
gui = [
    "dep:eframe",
    "dep:egui-snarl",
    "dep:xcap",
    "dep:enigo",
    "dep:ocrs",
    "dep:rten",
    "dep:directories",
    "dep:ureq",
]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rhai = "1"
eframe = { version = "0.36", optional = true, default-features = false, features = ["accesskit", "default_fonts", "glow", "links", "wayland", "web_screen_reader", "x11"] }
egui-snarl = { version = "0.12", optional = true }
xcap = { version = "0.4", optional = true }
enigo = { version = "0.3", optional = true }
ocrs = { version = "0.13", optional = true }
rten = { version = "0.26", optional = true }
directories = { version = "6", optional = true }
ureq = { version = "2.12", optional = true }

[[bin]]
name = "screen_automation"
path = "src/main.rs"
required-features = ["gui"]

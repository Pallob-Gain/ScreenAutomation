[package]
name = "screen_automation"
version = "0.1.0"
edition = "2021"
description = "n8n-like node automation driven by screen regions"

[features]
default = []
# Desktop backends (screen capture, OCR, input simulation) and the graph editor UI.
gui = [
    "dep:eframe",
    "dep:egui-snarl",
    "dep:xcap",
    "dep:enigo",
    "dep:ocrs",
    "dep:rten",
    "dep:rten-imageproc",
    "dep:directories",
    "dep:ureq",
    "dep:windows-sys",
    "dep:windows",
    "dep:rfd",
    "dep:cpal",
]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rhai = "1"
log = { version = "0.4", features = ["std"] }
regex = "1"
eframe = { version = "0.36", optional = true, default-features = false, features = ["accesskit", "default_fonts", "glow", "links", "wayland", "web_screen_reader", "x11"] }
egui-snarl = { version = "0.12", optional = true }
xcap = { version = "0.4", optional = true }
enigo = { version = "0.3", optional = true }
ocrs = { version = "0.13", optional = true }
rten = { version = "0.26", optional = true }
rten-imageproc = { version = "0.26", optional = true }
directories = { version = "6", optional = true }
ureq = { version = "2.12", optional = true }
rfd = { version = "0.15", optional = true }
cpal = { version = "0.15", optional = true }
boa_engine = "0.22.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = ["Win32_UI_Input_KeyboardAndMouse"] }
windows = { version = "0.58", optional = true, features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader"] }

[[bin]]
name = "screen_automation"
path = "src/main.rs"
required-features = ["gui"]
